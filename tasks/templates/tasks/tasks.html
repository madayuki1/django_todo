{% load django_browser_reload static %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tasks</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>
    <h1>Task List</h1>
    <section class="input-bar">
        <form action="" method="post">
            {% csrf_token %}
            <input type="text" name="title" id="task-input" placeholder="Task Name...">
            <input type="datetime-local" name="due_date" id="btn-date" value="{{ tomorrow| date:'Y-m-d\\TH:i' }}">
            <button type="submit">Submit</button>
        </form>
    </section>
    <section class="search-bar">
        <input type="search-bar" name="search" placeholder="Search...">
        <input type="button" value="Submit">
    </section>
    {% for task in tasks%}
    <section>
        <article class="task_element 
        {% if task.completed %} 
            completed-article 
        {% elif task.remaining_days == 'Overdue' %}
            overdue-article
        {% elif task.remaining_days == 'Today' %}
            today-article
        {% endif %}
        ">
            <div class='left-side'>
                <form action="{% url 'delete_task' task.id %}">
                    <button class='btn-delete' type="submit">
                       <img src="{% static "tasks/img/delete.png" %}" alt="Delete">
                    </button>
                </form>
                <span>{{ task.title }}</span>
                <span id="due-date">{{ task.due_date }}</span>
            </div>
            <div class="right-side">
                <span id="remaining-days">{{ task.remaining_days }}</span>
                <form action="{% url 'toggle_task' task.id %}">
                    <input
                        type="checkbox"
                        name="task_complete"
                        id="task_complete"
                        onchange="this.form.submit()"
                        {% if task.completed %} checked {% endif %}
                    >
                </form>
            </div>
        </article>
    </section>
    {% endfor %}
</body>
</html>
