{% load django_browser_reload static %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tasks</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>
    <h1>Task List</h1>
    <section>
        <form action="" method="post">
            {% csrf_token %}
            <input type="text" name="title" id="task-input">
            <input type="datetime-local" name="due_date" id="btn-date" value="{{ tomorrow| date:'Y-m-d\\TH:i' }}">
            <button type="submit">Submit</button>
        </form>
    </section>
    {% for task in tasks%}
    <section>
        <article class="task_element">
            <div class='left-side'>
                <form action="{% url 'delete_task' task.id %}">
                    <button class='btn-delete' type="submit">
                       <img src="{% static "tasks/img/delete.png" %}" alt="Delete">
                    </button>
                </form>
                <span>{{ task.title }}</span>
                <span id="due-date">{{ task.due_date }}</span>
                <span id="remaining-days">{{ task.remaining_days }} Days Remaining</span>
            </div>
            <form method="POST" action="{% url 'toggle_task' task.id %}">
                {% csrf_token %}
                <input 
                    type="checkbox"
                    name="task_complete"
                    id="task_complete"
                    onchange="this.form.submit()"
                    {% if task.completed %} checked {% endif %}
                >
            </form>
        </article>
    </section>
    {% endfor %}
</body>
</html>
