<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tasks</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>
    <h1>Task List</h1>
    {% for task in tasks%}
    <div class="container">
        <h1 class="element">{{ task.title }}</h1>
        <button class="element">{{task.completed}}</button>
    </div>
    {% endfor %}
</body>
</html>
