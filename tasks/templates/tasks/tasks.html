{% load django_browser_reload static %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="">
        <meta name="keywords" content="">
        <title>Todo Tasks</title>
        <link rel="stylesheet" href="{% static 'tasks/style.css' %}" />
    </head>
    <body>
        <h1>Task List</h1>
        <section class="toolbar">
            <div class="left-side">
                <a href="{% url 'task_create' %}" class="add-task">Add Task</a>
            </div>
            <div class="filter-container">
                <form class="filter-form" action="" method="get">
                    {% csrf_token %}
                    <input type="text"
                           class="filter-search"
                           placeholder="Search..."
                           name="search-list"
                           id="search-list">
                    <select class="filter-sort"
                            name="sort-list"
                            id="sort-list"
                            onchange="this.form.submit()">
                        {% for key, value in sorts.items %}
                            <option value="{{ key }}" {% if selected_sort == key %}selected{% endif %}>{{ value.label }}</option>
                        {% endfor %}
                    </select>
                    <span>Hide Completed</span>
                    <input type="checkbox"
                           name="hide-completed"
                           id="hide-completed"
                           {% if hide_completed %}checked{% endif %}
                           onchange="this.form.submit()" />
                </form>
            </div>
        </section>
        <div class="stats-container">{% include "tasks/partials/task_stats.html" %}</div>
        <div id="task-list">{% include "tasks/partials/task_list.html" %}</div>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
                integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
                crossorigin="anonymous"></script>
        <script src="{% static 'js/app.js' %}"></script>
    </body>
</html>
